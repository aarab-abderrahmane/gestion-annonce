<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>أنت غير متصل</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f4fbf8 0%, #e7f1ee 100%);
        color: #123c3a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(92vw, 34rem);
        padding: 2rem;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #c8d8d3;
        box-shadow: 0 12px 40px rgba(18, 60, 58, 0.08);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: 2rem;
      }

      p {
        margin: 0;
        line-height: 1.8;
        color: #45615f;
      }

      button {
        margin-top: 1.5rem;
        padding: 0.85rem 1.4rem;
        border: 0;
        border-radius: 999px;
        background: #006a60;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تحقق من الشبكة ثم أعد المحاولة. يمكنك الرجوع لاحقاً إلى الإعلانات والفعاليات عندما يعود الاتصال.</p>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    </main>
    <script>
      window.addEventListener("online", () => window.location.reload());
    </script>
  </body>
</html>
